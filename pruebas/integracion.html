<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pruebas de integración · Multi YouTube</title>
<style>body { font: 13px Consolas, monospace; background: #111; color: #ddd; margin: 0; } #resultado { display: none; }
iframe { width: 1280px; height: 720px; border: 0; display: block; }</style>
</head>
<body>
<pre id="legible">corriendo…</pre>
<pre id="resultado"></pre>
<script src="marco.js"></script>
<script>
// La aplicación completa en un iframe, con datos de prueba. Se corre con pruebas/correr.py, que usa un navegador sin
// interfaz con un perfil temporal, sin acceso a internet y en otro puerto: nunca toca tus listas ni tu archivo de datos.
// Por seguridad no corre en el puerto del servidor real ni sin ?aislado=1.
if (location.port === '18090' || !/aislado=1/.test(location.search)) {
  document.getElementById('legible').textContent = 'Estas pruebas se corren con probar.bat (en un navegador aislado). Abiertas aquí borrarían tus datos.';
  throw new Error('no aislado');
}
const U = i => 'https://www.youtube.com/watch?v=' + i;
const V = ['aaaaaaaaaaa', 'bbbbbbbbbbb', 'ccccccccccc', 'ddddddddddd'];
const CAMARA = 'http://10.255.255.1/video.mjpg';
localStorage.clear();
localStorage.setItem('multiyoutube.config.v1', JSON.stringify({
  listas: { 'A': [U(V[0]), U(V[1]), U(V[2]), '# comentario', 'esto no es url', CAMARA], 'B': [U(V[2]), U(V[3]), U(V[0])] },
  actual: 'A', mute: true, fade: 0, fadeImg: 0, guardado: Date.now()
}));
const f = document.createElement('iframe');
f.src = '../index.html';
document.body.appendChild(f);

let w, d;
const c = () => [...d.querySelectorAll('#contenedor .celda')].sort((a, b) => a.style.order - b.style.order);
const conAudio = () => c().findIndex(x => x.dataset.mute === '0');
const tecla = k => d.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
const cargados = () => c().filter(x => x.dataset.tipo !== 'camara' && x.querySelector('iframe') &&
                                      /^https:\/\//.test(x.querySelector('iframe').getAttribute('src') || '')).length;
const cambiarLista = n => { const s = d.getElementById('selLista'); s.value = n; s.dispatchEvent(new w.Event('change')); };

prueba('la grilla arma un cuadro por línea y guarda aparte los comentarios', () => {
  igual(c().length, 5);
  igual(w.eval('comentarios'), ['# comentario']);
  cierto(c()[3].classList.contains('error'), 'la línea mala queda marcada');
  igual(c()[4].dataset.tipo, 'camara');
});
prueba('carga escalonada: todos los videos terminan cargados', () => igual(cargados(), 3));
prueba('audio exclusivo: uno a la vez', () => {
  w.alternarAudio(c()[1]); igual(conAudio(), 1);
  w.alternarAudio(c()[0]); igual(conAudio(), 0);
  igual(c().filter(x => x.dataset.mute === '0').length, 1);
});
prueba('ni la cámara ni la línea mala reciben el audio', () => {
  w.alternarAudio(c()[4]); igual(conAudio(), 0);
  igual(w.puedeSonar(c()[4]), false);
});
prueba('tecla M silencia todo y lo devuelve al mismo', () => {
  tecla('m'); igual(conAudio(), -1);
  tecla('m'); igual(conAudio(), 0);
});
prueba('silenciar todo (M) silencia al instante, también los canales de TV', async () => {
  w.eval('config.listas["S"] = ["https://tv.invalid/canal.m3u8", "https://www.youtube.com/watch?v=s0000000001"]; config.actual = "S"');
  w.pintarSelector(); w.render(true); await espera(1500);
  const v = c()[0].querySelector('video.tv');
  w.alternarAudio(c()[0]);
  igual(v.muted, false, 'el canal de TV suena');
  tecla('m');
  igual(v.muted, true, 'M lo silencia en el acto (sin esperar al vigilante)');
  tecla('m');
  igual(v.muted, false, 'M de nuevo devuelve el sonido al mismo');
  // Clic en el que suena (silencio sin fundido): también inmediato
  w.alternarAudio(c()[0]);
  igual(v.muted, true, 'silenciar con clic también es inmediato');
  // Vigilante: si algo lo deja sonando sin tener el audio, se vuelve a silenciar
  v.muted = false;
  await espera(50);
  igual(v.muted, true, 'el vigilante lo vuelve a silenciar');
  cambiarLista('A'); await espera(1500);
});
prueba('pasando rápido por canales, solo suena el que estás viendo (los que cargaban no suenan después)', async () => {
  w.eval('config.listas["R"] = ["https://tv.invalid/r1.m3u8", "https://tv.invalid/r2.m3u8", "https://tv.invalid/r3.m3u8"]; ' +
         'config.actual = "R"; config.fade = 3');
  w.pintarSelector(); w.render(true); await espera(1500);
  const v = i => c()[i].querySelector('video.tv');
  // Ninguno llegó a reproducir (cargando): al pasar al siguiente, el anterior queda mudo al instante, sin fundido
  w.alternarAudio(c()[0]);
  w.alternarAudio(c()[1]);
  igual([v(0).muted, !!c()[0]._rampa], [true, false], 'el que cargaba quedó mudo al tiro');
  // Si el anterior sí se oía, baja con fundido...
  c()[1]._listo = true; c()[1]._estado = 1; c()[1].classList.remove('cargando-tv', 'caido', 'esperando');
  w.alternarAudio(c()[2]);
  cierto(c()[1]._rampa, 'el que se oía baja con fundido');
  // ...pero si sigues pasando, ese fundido se corta en seco
  w.alternarAudio(c()[0]);
  igual([v(1).muted, !!c()[1]._rampa], [true, false], 'el fundido anterior se cortó');
  igual(c().filter(x => x.dataset.mute === '0').length, 1, 'uno solo tiene el audio');
  w.eval('config.fade = 0');
  cambiarLista('A'); await espera(1500);
});
prueba('TV más rápida: calidad baja al partir, tiempos cortos y la dirección que funcionó primero', async () => {
  const P = 'https://tv.invalid/principal.m3u8', R = 'https://tv.invalid/respaldo.m3u8';
  w.eval('config.listas["V"] = ["' + P + '"]; config.tv[clave("' + P + '")] = { nombre: "Canal", respaldos: ["' + R + '"], preferida: "' + R + '" }; ' +
         'config.actual = "V"');
  w.eval('window._probadas = []; window._iniciarTvOrig = iniciarTv; ' +
         'iniciarTv = function (cel, v, u, ex) { _iniciarTvOrig(cel, v, u, ex); _probadas.push(cel._urlTv); }');
  w.pintarSelector(); w.render(true); await espera(200);
  w.eval('iniciarTv = _iniciarTvOrig');
  const t = c()[0];
  igual(w._probadas[0], R, 'parte por la dirección que funcionó la vez anterior');
  if (t._hls) {
    igual(t._hls.config.startLevel, 0, 'arranca en la calidad más baja');
    igual(t._hls.config.manifestLoadingTimeOut, 6000, 'abandona antes una dirección muerta');
  }
  // Cuando una dirección funciona, se recuerda (aquí: la principal)
  t._urlTv = P; t._listo = false;
  t.querySelector('video.tv').dispatchEvent(new w.Event('playing'));
  igual(w.eval('config.tv[clave("' + P + '")].preferida'), undefined, 'si funcionó la principal, ya no hay preferida');
  cambiarLista('A'); await espera(1500);
});
prueba('modo liviano: con uno ampliado, el anterior y el siguiente quedan precargados', async () => {
  const L = ['n1', 'n2', 'n3', 'n4', 'n5'].map(x => 'https://www.youtube.com/watch?v=' + x.padEnd(11, '0'));
  w.eval('config.listas["N"] = ' + JSON.stringify(L) + '; config.actual = "N"; config.maxActivos = 1');
  w.pintarSelector(); w.render(true); await espera(300);
  w.alternarMax(c()[2]);
  await espera(800);
  const despiertos = c().map(x => !x.classList.contains('dormida'));
  igual(despiertos, [false, true, true, true, false], 'el ampliado (3) y sus vecinos (2 y 4) cargados; el resto duerme');
  w.restaurarTodo();
  w.eval('config.maxActivos = 0');
  cambiarLista('A'); await espera(1500);
});
prueba('al ampliar, los tapados se descargan del todo y vuelven al volver a la grilla', async () => {
  const L = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6'].map(x => 'https://www.youtube.com/watch?v=' + x.padEnd(11, '0'));
  w.eval('config.listas["D"] = ' + JSON.stringify(L) + '; config.actual = "D"; config.maxActivos = 0; config.descargarOcultos = true');
  w.pintarSelector(); w.render(true); await espera(3000);
  try {
    const cargado = x => !x.classList.contains('dormida') && !x.querySelector('iframe').dataset.src;
    igual(c().map(cargado), [true, true, true, true, true, true], 'en la grilla todos cargan');
    w.alternarMax(c()[2]); await espera(800);
    igual(c().map(cargado), [false, true, true, true, false, false], 'ampliado (3) y vecinos (2 y 4); el resto descargado');
    igual(c()[5].querySelector('iframe').getAttribute('src'), 'about:blank', 'los tapados no cargan nada');
    w.restaurarTodo(); await espera(3000);
    igual(c().map(cargado), [true, true, true, true, true, true], 'al volver a la grilla se cargan de nuevo');
    w.eval('config.descargarOcultos = false');
    w.alternarMax(c()[2]); await espera(800);
    igual(c().map(cargado), [true, true, true, true, true, true], 'con la opción apagada no se descargan');
    w.restaurarTodo();
  } finally {
    w.eval('config.descargarOcultos = true');
    cambiarLista('A'); await espera(1500);
  }
});
prueba('programas ⏰: a la hora cambia a la lista del canal, lo amplía y le da el audio', async () => {
  const X = 'https://www.youtube.com/watch?v=' + 'programa001', O = 'https://www.youtube.com/watch?v=' + 'otrovideo01';
  const t = new w.Date(2026, 9, 30, 21, 0, 0);   // viernes 30/10/2026 21:00
  w.eval('config.listas["Noticias"] = ' + JSON.stringify([O, X]) + '; config.programas = [{ hora: "21:00", dias: [5], lista: "Noticias", linea: "' + X + '", activo: true }]');
  try {
    // El ⚙ muestra el programa y al guardar queda igual
    w.llenarProgramas();
    const fila = d.querySelector('#listaProgramas .programa');
    igual(fila.querySelector('.hora').value, '21:00');
    igual([...fila.querySelectorAll('.dia input:checked')].map(x => x.value), ['5'], 'solo el viernes marcado');
    igual(JSON.parse(fila.querySelector('.canal').value), ['Noticias', X], 'el canal elegido');
    w.leerProgramas();
    igual(w.eval('config.programas[0].linea'), X, 'al guardar se conserva');
    // Un minuto antes avisa; a la hora cambia
    w.revisarProgramas(new w.Date(t.getTime() - 30000));
    cierto(d.getElementById('indicador').textContent.includes('En 1 minuto'), 'aviso un minuto antes');
    igual(w.eval('config.actual'), 'A', 'todavía no cambia');
    w.revisarProgramas(new w.Date(t.getTime() + 20000));
    await espera(300);
    igual(w.eval('config.actual'), 'Noticias', 'pasó a la lista del canal');
    const celda = c()[1];
    cierto(celda.classList.contains('max'), 'el canal queda ampliado');
    igual(celda.dataset.mute, '0', 'y con el audio');
    cierto(d.getElementById('indicador').textContent.includes('⏰ 21:00'), 'avisa qué programa es');
    // No se repite, y otro día de la semana no corre
    cambiarLista('A'); await espera(300);
    w.revisarProgramas(new w.Date(t.getTime() + 60000));
    igual(w.eval('config.actual'), 'A', 'el mismo programa no vuelve a cambiar');
    w.revisarProgramas(new w.Date(t.getTime() + 86400000 + 10000));
    igual(w.eval('config.actual'), 'A', 'el sábado no está marcado');
  } finally {
    w.restaurarTodo();
    w.eval('config.programas = []; delete config.listas["Noticias"]');
    cambiarLista('A'); await espera(1500);
  }
});
prueba('🔗 compartir: copia un link que abre ese canal ampliado en su lista', async () => {
  const X = 'https://www.youtube.com/watch?v=' + 'compartido1', O = 'https://www.youtube.com/watch?v=' + 'otrocanal01';
  w.eval('config.listas["Comp"] = ' + JSON.stringify([O, X]) + '; window._copiado = ""; window._copiarOrig = copiarTexto; ' +
         'copiarTexto = async t => { window._copiado = t; return true; }');
  w.pintarSelector();
  try {
    // El botón solo se ve con el cuadro ampliado
    igual(w.getComputedStyle(c()[0].querySelector('.compartir')).display, 'none', 'en la grilla no aparece');
    cambiarLista('Comp'); await espera(300);
    w.alternarMax(c()[1]);
    igual(w.getComputedStyle(c()[1].querySelector('.compartir')).display, 'block', 'ampliado sí aparece');
    c()[1].querySelector('.compartir').click(); await espera(50);
    const link = new w.URL(w._copiado);
    igual([link.searchParams.get('ver'), link.searchParams.get('lista')], [X, 'Comp'], 'el link trae el canal y su lista');
    w.restaurarTodo();
    // Abrir el link: cambia a la lista, lo amplía y le da el audio; la dirección queda limpia
    cambiarLista('A'); await espera(300);
    const antes = w.location.href;
    w.history.replaceState(null, '', link.pathname + link.search);
    w.abrirCompartido(); await espera(300);
    igual(w.eval('config.actual'), 'Comp', 'pasó a su lista');
    cierto(c()[1].classList.contains('max'), 'ampliado');
    igual(c()[1].dataset.mute, '0', 'con el audio');
    igual(w.location.search, '', 'al recargar ya no vuelve a saltar');
    w.restaurarTodo();
    // Un canal que no está en ninguna lista: se muestra sin guardarlo
    const N = 'https://www.youtube.com/watch?v=' + 'noestaenlis';
    cambiarLista('A'); await espera(300);
    const nA = w.eval('config.listas["A"].length');
    w.history.replaceState(null, '', link.pathname + '?ver=' + encodeURIComponent(N));
    w.abrirCompartido(); await espera(300);
    const ult = c()[c().length - 1];
    igual(ult.dataset.linea, N, 'aparece al final de la vista');
    cierto(ult.classList.contains('max'), 'ampliado');
    igual(w.eval('config.listas["A"].length'), nA, 'no se guarda en la lista');
    w.restaurarTodo();
    cambiarLista('Comp'); await espera(300); cambiarLista('A'); await espera(300);
    cierto(!c().some(x => x.dataset.linea === N), 'al cambiar de lista desaparece');
    w.history.replaceState(null, '', antes);
  } finally {
    w.eval('copiarTexto = _copiarOrig; delete config.listas["Comp"]; extraTemporal = null');
    w.restaurarTodo();
    cambiarLista('A'); await espera(1500);
  }
});
prueba('carrusel también con un canal ampliado (sin pantalla completa)', async () => {
  const b = d.getElementById('btnCarrusel');

prueba('🔍 buscar parecido: resultados como miniaturas, en vivo y con el permiso del dueño', async () => {
  const R = [
    { id: 'aaaaaaaaaaa', titulo: 'Noticias en vivo', canal: 'Canal A', vivo: true, detalle: '997 lo están viendo', incrustable: true, miniatura: 'about:blank' },
    { id: 'bbbbbbbbbbb', titulo: 'Bloqueado', canal: 'Canal B', vivo: true, detalle: '', incrustable: false, miniatura: 'about:blank' },
    { id: 'ccccccccccc', titulo: 'Sin saber', canal: 'Canal C', vivo: false, detalle: '', incrustable: null, miniatura: 'about:blank' }];
  w.eval('window._apiOrig = api; window._pedidos = []; api = async (que, p) => { _pedidos.push([que, p]); return { resultados: ' + JSON.stringify(R) + ' }; }');
  try {
    w.abrirBuscar(c()[0]); await espera(100);
    d.getElementById('buscarTexto').value = 'noticias en vivo';
    d.getElementById('btnBuscarYT').click(); await espera(100);
    igual(w._pedidos[w._pedidos.length - 1], ['buscar', { q: 'noticias en vivo', vivo: '0' }], 'busca aquí mismo');
    const res = [...d.querySelectorAll('#buscarResultados .resultado')];
    igual(res.length, 3, 'una miniatura por resultado');
    cierto(res[0].querySelector('.etq-vivo') && !res[2].querySelector('.etq-vivo'), 'marca los que están en vivo');
    igual(res.map(x => [...x.querySelector('.permiso').textContent][0]), ['✅', '🔒', '❔'], 'permiso del dueño');
    res[1].click();
    igual(d.getElementById('buscarNuevaUrl').value, '', 'el bloqueado no se puede elegir');
    res[0].click();
    igual(d.getElementById('buscarNuevaUrl').value, 'https://www.youtube.com/watch?v=aaaaaaaaaaa', 'el elegido queda listo para reemplazar');
    cierto(res[0].classList.contains('elegido'));
    d.getElementById('buscarSoloVivo').checked = true;
    d.getElementById('buscarSoloVivo').dispatchEvent(new w.Event('change')); await espera(50);
    igual(w._pedidos[w._pedidos.length - 1][1].vivo, '1', '"Solo en vivo" vuelve a buscar con el filtro');
  } finally {
    w.eval('api = _apiOrig');
    w.cerrarBuscar();
  }
});
prueba('enfoque: viendo un solo canal más de 2 min, los demás no consultan a YouTube; al volver se ponen al día', async () => {
  w.eval('window._apiOrig = api; window._srvOrig = servidorOk; servidorOk = true; window._pedidos = []; ' +
         'api = async (que, p) => { _pedidos.push([que, p]); return { vivo: true, directo: true }; }');
  const otro = c()[1];
  try {
    w.alternarMax(c()[0]);
    w.vigilarEnfoque();
    igual(w.enEnfoque(), false, 'recién ampliado todavía no');
    w.eval('enfoqueDesde = Date.now() - 3 * 60000');
    igual(w.enEnfoque(), true, 'después de 2 min sí');
    w.revisarDirecto(otro);
    await espera(50);
    igual(w._pedidos.length, 0, 'el cuadro de atrás no consulta');
    cierto(otro._directoPendiente, 'queda pendiente');
    w.eval('revisionAutomatica()');
    cierto(w.eval('revisionPendiente'), 'la revisión automática también espera');
    w.restaurarTodo();
    w.vigilarEnfoque();
    await espera(100);
    igual(w.enEnfoque(), false);
    cierto(w._pedidos.some(([q, p]) => q === 'video' && p.id === w.parsear(otro.dataset.linea).id), 'al volver revisa lo pendiente');
    cierto(!w.eval('revisionPendiente'), 'y corre la revisión que esperaba');
  } finally {
    w.eval('api = _apiOrig; servidorOk = _srvOrig; enfoqueDesde = 0');
    w.restaurarTodo();
  }
});
prueba('🔍 buscar en un directo: arriba, todo lo que su canal transmite en vivo ahora; clic copia la URL', async () => {
  const canal = 'UC' + 'k'.repeat(22);
  const k = w.clave(c()[0].dataset.linea);
  const antes = w.eval('JSON.stringify(config.nombres[' + JSON.stringify(k) + '] || null)');
  w.eval('config.nombres[' + JSON.stringify(k) + '] = { titulo: "Cámara 1", autor: "Ledrium", vivo: true, canal: "' + canal + '" }');

  const V2 = { id: 'eeeeeeeeeee', titulo: 'Cámara 2', canal: '', vivo: true, detalle: '7 lo están viendo', incrustable: true, miniatura: 'about:blank' };
  w.eval('window._apiOrig = api; window._pedidos = []; api = async (que, p) => { _pedidos.push([que, p]); ' +
         'return que === "vivoscanal" ? { resultados: ' + JSON.stringify([V1, V2]) + ' } : { resultados: ' + JSON.stringify([V1]) + ' }; }');

    cierto(!d.getElementById('buscarCanalBloque').hidden, 'se ve la sección del canal');

    const arriba = [...d.querySelectorAll('#buscarCanal .resultado')];
    igual(arriba.length, 2, 'todos sus directos');
    cierto(/Ledrium/.test(arriba[0].querySelector('.a').textContent), 'con el nombre del canal');
    igual(d.querySelectorAll('#buscarResultados .resultado').length, 1, 'y abajo la búsqueda (aunque se repita)');
    arriba[1].click(); await espera(50);
    igual(d.getElementById('buscarNuevaUrl').value, 'https://www.youtube.com/watch?v=eeeeeeeeeee', 'clic: su URL queda lista');
    // Un video que no es directo no muestra la sección
    w.cerrarBuscar();
    w.eval('config.nombres[' + JSON.stringify(k) + '] = { titulo: "Video", autor: "X", vivo: false }');

    w.eval('config.nombres[' + JSON.stringify(k) + '] = ' + antes + '; if (!config.nombres[' + JSON.stringify(k) + ']) delete config.nombres[' + JSON.stringify(k) + ']');
    w.cerrarBuscar();
  }
});

prueba('canal de rudo.video: iframe con su página y audio exclusivo recargándolo', async () => {
  const R = 'https://rudo.video/live/tvn', Y = 'https://www.youtube.com/watch?v=' + 'rudoprueba1';
  w.eval('config.listas["R"] = ' + JSON.stringify([Y, R]) + '; config.actual = "R"; config.mute = true');
  w.pintarSelector(); w.render(true); await espera(1500);
  try {
    const [y, r] = c();
    const ifr = r.querySelector('iframe');
    cierto(r.classList.contains('rudo') && r.classList.contains('en-vivo'), 'cuadro de rudo, en vivo');
    igual(ifr.src, R, 'carga su página oficial');
    igual(w.getComputedStyle(r.querySelector('.volumen')).display, 'none', 'sin volumen propio');
    // Un clic dentro de su reproductor (la ventana pierde el foco y el iframe queda activo) le da el audio
    ifr.focus(); w.dispatchEvent(new w.Event('blur')); await espera(50);
    if (d.activeElement === ifr) {
      igual(r.dataset.mute, '0', 'el clic en su reproductor le da el audio');
      cierto(r._rudoSonido, 'queda marcado como que puede sonar');
    } else w.alternarAudio(r);
    cierto(r._rudoSonido, 'puede sonar');
    // El audio pasa a otro cuadro: se recarga para que su reproductor vuelva a partir silenciado
    let recargas = 0;   // cada vez que se le vuelve a poner la dirección
    new w.MutationObserver(m => { recargas += m.length; }).observe(ifr, { attributes: true, attributeFilter: ['src'] });
    w.alternarAudio(y);
    igual(r.dataset.mute, '1', 'pierde el audio');
    cierto(!r._rudoSonido, 'ya no suena');
    await espera(100);
    igual(recargas, 1, 'se recargó una vez');
    igual(ifr.src, R, 'con la misma página');
    w.comandoYT(ifr, 'mute'); await espera(500);
    igual(recargas, 1, 'otro "silenciar" no lo vuelve a recargar');
  } finally {
    cambiarLista('A'); await espera(1500);
  }
});
prueba('"▶ Ver en YouTube": ventana chica encima del cuadro y de su tamaño', () => {
  const abiertas = [];
  const original = w.open;
  w.open = (url, nombre, opciones) => {
    const o = Object.fromEntries(opciones.split(',').filter(x => x.includes('=')).map(x => x.split('=')).map(([k, v]) => [k, Number(v)]));
    abiertas.push({ url, nombre, o, movida: null });
    return { moveTo: (x, y) => { abiertas[abiertas.length - 1].movida = [x, y]; }, resizeTo: () => {}, focus: () => {} };
  };
  try {
    const celda = c()[0];
    const r = celda.getBoundingClientRect();
    w.verEnYouTube(celda);
    const a = abiertas[0];
    cierto(a.url.startsWith('https://www.youtube.com/'), 'abre YouTube');
    igual(a.nombre, 'multiyoutube-youtube', 'siempre la misma ventana');
    igual([a.o.width, a.o.height], [Math.max(480, Math.round(r.width)), Math.max(300, Math.round(r.height))], 'del tamaño del cuadro (mín. 480 × 300)');
    igual(a.movida, [a.o.left, a.o.top], 'si ya estaba abierta, se mueve al cuadro');
    w.alternarMax(celda);
    w.verEnYouTube(celda);
    const b = abiertas[1];
    cierto(b.o.width <= Math.round(w.screen.availWidth * 0.7) && b.o.height <= Math.round(w.screen.availHeight * 0.7),
           'con el cuadro ampliado no tapa toda la pantalla');
    w.restaurarTodo();
  } finally { w.open = original; }
});
prueba('ventana de YouTube abierta: Multi YouTube en silencio; al cerrarla vuelve el audio', async () => {
  const original = w.open;
  const falsa = { closed: false, moveTo() {}, resizeTo() {}, focus() {} };
  w.open = () => falsa;
  try {
    if (!c().some(x => x.dataset.mute === '0')) w.alternarAudio(c()[0]);
    const sonaba = c().find(x => x.dataset.mute === '0');
    w.verEnYouTube(c()[1]);
    igual(c().filter(x => x.dataset.mute === '0').length, 0, 'al abrir la ventana se silencia todo');
    cierto(d.getElementById('btnMuteGeneral').classList.contains('activo'), 'como el botón de silenciar todo');
    falsa.closed = true;
    await espera(1500);
    igual(sonaba.dataset.mute, '0', 'al cerrarla vuelve el audio al que sonaba');
    // Si activaste el sonido a mano mientras estaba abierta, al cerrarla no se toca
    falsa.closed = false;
    w.verEnYouTube(c()[1]);
    w.alternarAudio(c()[2]);
    falsa.closed = true;
    await espera(1500);
    igual(c().filter(x => x.dataset.mute === '0').map(x => c().indexOf(x)), [2], 'sigue sonando el que elegiste');
  } finally { w.open = original; }
});

prueba('mover y copiar un cuadro a otra lista (sin duplicar)', async () => {
  w.eval('config.listas["M1"] = ["https://www.youtube.com/watch?v=mmmmmmmmmm1", "https://www.youtube.com/watch?v=mmmmmmmmmm2"]; ' +
         'config.listas["M2"] = ["https://youtu.be/mmmmmmmmmm2"]; config.actual = "M1"');
  w.pintarSelector(); w.render(true); await espera(300);
  // Mover el primero a M2
  c()[0].querySelector('.mover').click();
  cierto(d.getElementById('fondoMover').classList.contains('abierto'));
  cierto(![...d.querySelectorAll('#moverDestino option')].some(o => o.value === 'M1'), 'no ofrece la lista actual');
  d.getElementById('moverDestino').value = 'M2';
  d.getElementById('btnMoverMover').click();
  igual(w.eval('config.listas.M1'), ['https://www.youtube.com/watch?v=mmmmmmmmmm2']);
  igual(w.eval('config.listas.M2'), ['https://youtu.be/mmmmmmmmmm2', 'https://www.youtube.com/watch?v=mmmmmmmmmm1']);
  igual(c().length, 1, 'salió de la grilla');
  // Copiar el que ya está en M2 (escrito distinto): no se duplica y sigue aquí
  c()[0].querySelector('.mover').click();
  d.getElementById('moverDestino').value = 'M2';
  d.getElementById('btnMoverCopiar').click();
  igual(w.eval('config.listas.M2').length, 2, 'no se duplica');
  cierto(/Ya estaba/.test(d.getElementById('indicador').textContent));
  // Copiar a una lista nueva agrupada
  c()[0].querySelector('.mover').click();
  d.getElementById('moverDestino').value = '__nueva__'; d.getElementById('moverDestino').dispatchEvent(new w.Event('change'));
  cierto(!d.getElementById('moverNueva').hidden, 'pide el nombre');
  d.getElementById('moverNueva').value = 'Grupo X / Nueva';
  d.getElementById('btnMoverCopiar').click();
  igual(w.eval('config.listas["Grupo X / Nueva"]'), ['https://www.youtube.com/watch?v=mmmmmmmmmm2']);
  igual(w.eval('config.listas.M1').length, 1, 'copiar lo deja en la original');
  // Botón "＋ Crear lista nueva": propone el nombre dentro del grupo actual y Enter mueve
  cambiarLista('Grupo X / Nueva'); await espera(300);
  c()[0].querySelector('.mover').click();
  igual(d.getElementById('moverDestino').options[0].value, '__nueva__', '"Nueva lista" es la primera opción');
  d.getElementById('btnMoverNueva').click();
  igual(d.getElementById('moverNueva').value, 'Grupo X / ', 'propone el mismo grupo');
  d.getElementById('moverNueva').value = 'Grupo X / Otra';
  d.getElementById('moverNueva').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  igual(w.eval('config.listas["Grupo X / Otra"]'), ['https://www.youtube.com/watch?v=mmmmmmmmmm2'], 'creada y movido con Enter');
  igual(w.eval('config.listas["Grupo X / Nueva"]'), [], 'salió de la anterior');
  cambiarLista('A');
});
prueba('el audio no se pierde: el que suena sigue al cambiar a una lista que también lo tiene', async () => {
  const Y = i => 'https://www.youtube.com/watch?v=' + i;
  w.eval('config.listas["P1"] = ["' + Y('p0000000001') + '", "' + Y('p0000000002') + '"]; ' +
         'config.listas["P2"] = ["' + Y('p0000000002') + '", "' + Y('p0000000003') + '"]; ' +
         'config.listas["P3"] = ["' + Y('p0000000009') + '", "' + Y('p0000000002') + '"]; ' +
         'config.nombres["video:p0000000009"] = { titulo: "bloqueado", externo: Date.now(), t: 1 }; ' +
         'config.ultimos["lista:P3"] = { clave: "video:p0000000009", max: false }; ' +
         'delete config.ultimos["lista:P2"]; config.actual = "P1"; config.mute = true');
  w.pintarSelector(); w.render(true); await espera(300);
  w.alternarAudio(c()[1]);                        // suena p…2
  igual(conAudio(), 1);
  cambiarLista('P2'); await espera(300);          // P2 también lo tiene (y "Silenciados" está activo)
  igual(c()[conAudio()] && c()[conAudio()].dataset.linea.slice(-11), 'p0000000002', 'sigue sonando en P2');
  cambiarLista('P3'); await espera(300);          // P3 "retomaría" uno bloqueado: no debe dejar todo en silencio
  igual(c()[conAudio()] && c()[conAudio()].dataset.linea.slice(-11), 'p0000000002', 'sigue sonando en P3');
});
